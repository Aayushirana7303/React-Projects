<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container {
            display: inline-grid;
            /* 2 display: inline grid */
            /* You can adjust the gap size by using one of the following properties:
              1. column-gap,2. row-gap,3. gap  */
            gap: 4px;
            grid-template-columns: auto auto auto;
            /*The grid-template-columns property defines the number of columns in your grid layout,and it can define 
            the width of each column.*/
            /* grid-template-columns: 120px 100px; */
            /* The grid-template-rows property defines the height of each row. */
            /* jitne row ya columns bnane ho utne hi auto use krte h */
            /* Justify-content: is used to align the whole grid inside the container. 
            its values are 1.center,2.space-evenly,
            3.space-around
            4.space-between,5.start,6.end */
            background-color: rgb(183, 176, 232);
            width: 980px;
            padding: 10px;
        }
            /* Align-content is used to vertically align the whole grid inside the container. values are 1.center,
            2.space-evenly,3.space-around,4.space-between,5.start,6.end  */
        /* .item1 {
            grid-column-start: 1;
            grid-column-end: 3;
        } It is a property of grid */
        .item {
            background-color: rgb(17, 103, 124);
            border: 1px solid black;
            border-radius: 1px;
            padding: 10px;
            text-align: center;
            width: 300px;
            font-size: 24px;
            font-style: bold;
        }
    </style>
</head>

<body>
    <h1>This will display grid</h1>
    <p>we use display grid to make a block level grid container.</p>
    <div class="container">
        <div class="item">Item -1</div>
        <div class="item">Item -2</div>
        <div class="item">Item -3</div>
        <div class="item">Item -4</div>
        <div class="item">Item -5</div>
        <div class="item">Item -6</div>
        <div class="item">Item -7</div>
        <div class="item">Item -8</div>
        <div class="item">Item -9</div>
    </div>

</body>

</html>
