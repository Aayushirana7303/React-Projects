<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes and Animations</title>
</head>
<style>
    .container{
        background-color: rgb(34, 197, 215);
    }
    .box{
        background-color: blueviolet;
        height: 250px;
        width: 250px;
        animation-name:anny1;
        animation-duration: 2s;
        animation-iteration-count: 3;
    }
    @keyframes anny1 {
        from{
            width: 200px;
        }
        to{
            width: 400px;
        }
    }
</style>
<body>
    <div class="container">
        <div class="box">
            This is a box
        </div>
    </div>
</body>
</html>
