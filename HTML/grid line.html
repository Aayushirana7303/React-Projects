<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid cell</title>
    <style>
        .container{
            height: 100vh;
            width: 98vw;
            color: rgb(237, 159, 43);
            border: 2px solid rgba(11, 1, 1, 0.862);
            display: grid;
            grid-template-columns: auto auto auto;
        }
        .box{
            border: 2px solid rgb(12, 2, 2);
            margin: 15px;
            background-color: rgb(7, 148, 148);
            font-size: 40px;
            font-style: italic;
            text-align: center;
            -webkit-text-stroke: 2px black;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item-1 box">HELLO</div>
        <div class="item-2 box">HII</div>
        <div class="item-3 box">NAMASTE</div>
        <div class="item-4 box">HOLA</div>
        <div class="item-5 box">BONJOUR</div>
        <div class="item-11 box">MARHABA</div>
        <div class="item-12 box">CIAO</div>
        <div class="item-13 box">OLA</div>
        <div class="item-14 box">JAMBO</div>
    </div>
</body>
</html>
