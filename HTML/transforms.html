<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transforms</title>
    <style>
        .box{
             height: 70px;
             width: 70px;
             background-color: rgb(240, 57, 57);
             border: 2px solid black;
             /* transform: rotate(40deg); */
             /* transform: rotate(0.5turn); */
             /* transform: rotateX(45deg); */
             /* transform: rotateY(45deg); */
             /* transform: rotateZ(45deg); */
             /* scale use for increase the size of any box  */
             /* transform: scale(1.3); */
             /* transform: scaleX(1.6); */
             /* transform: skew(12deg); */
             /* skew will not apply for z axis */
             /* transform: translate(100%); */
             transform: translateY(100%) skewX(40deg) translateX(50%);
             display: flex;
             justify-content: center;
             align-items: center;
        }
        .container{
            height: 80vh;
             width: 90vw;
             border: 2px solid rgb(98, 5, 79);
             /* display: flex;
             justify-content: center;
             align-items: center; */
        }
    </style>
</head>
<body>
    <h2>Hey, I am Aayushi</h2>
    <div class="container">
        <div class="box">
             A Box
        </div>
    </div>
</body>
</html>
