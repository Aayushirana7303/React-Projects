<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filters</title>
    <style>
        img{
            /* filter: blur(5px); */
            filter: brightness(100%) contrast(100%);
            filter: invert(0.2);
            filter: opacity(1.2);
        }
        img2{
             height: 30px;
             width: 28px;
        }
        img3{
             height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="imag2.webp" alt="AI">
        <img class="img2" src="https://img.etimg.com/thumb/width-1200,height-1200,imgsize-34284,resizemode-75,msid-101480759/magazines/panache/srk-meets-with-accident-during-shoot-in-los-angeles-undergoes-surgery.jpg" alt="SRK">
        <img class="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0m3VoOv3vx-27e3iu63T3iFKS47AG2lKunw&s" alt="Akshay">
    </div>
</body>
</html>
