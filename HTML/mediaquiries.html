<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Media Query</title>
    <style>
       body{
        background-color: rgb(195, 141, 247);
       }
       /* Syntax of medai query- @media not|only mediatype and (expressions) {
       CSS-code;, some mediatype = all, print,screen,speech devices for blinds
       } */
        .box{
            width: 200px;
            height: 160px;
            background-color: rgb(44, 37, 37);
            padding: 3px;
            margin: 3px;
        }
        @media only screen and (max-width: 455px){
            body{
                background-color: rgb(83, 83, 172);
            }
            
        }
    </style>
</head>
<body>
    <div class="red">
        Hey I am a red body Guy!
    </div>
    <br>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
