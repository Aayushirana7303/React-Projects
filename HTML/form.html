<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>NEET EXAMINATION FORM</h1>
    <form action="post">
        <div>
            <label for="username">Enter user name</label>
            <br>
            <!-- label tag k for me input tag ki id likhte h -->
            <input type="text" id="username" name="clintname" placeholder="Enter name" autofocus>
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="Female" name="gender" value="Female">
            <label for="Female">Female</label>
            <!-- The value attribute is used to set the value of <input> elements -->
            <!--input tags m name attribute agr same rakhte h to bss ek hi button click hoga otherwise differ h to dono button click honge -->
        </div>
        <div>
             <label for="acept and agree">Privacy and Policy</label><br>
             <input type="checkbox" id="acept and agree" name="clickme" value="yes">
        </div>
        <div>
            <label for="email">Enter Your Email</label><br>
            <input type="email" id="email" name="email" placeholder="Example@gmail.com" multiple/>
            <!-- isme multiple attribute bhot sari emails ko same input tag m enter krne k liye use krte h(separated by commas) -->
        </div>
        <div>
            <label for="search">Search here</label><br>
            <input type="search" id="search" name="search" />
        </div>
        <div>
            <label for="tel">Your Contact Number</label><br>
            <input type="tel" id="tel" name="tel" />
        </div>
        <div>
            <label for="url">Enter URL</label><br>
            <input type="url" id="url" name="url" />
        </div>
        <div>
            <input type="number" name="age" id="age" min="1" max="10" step="2" />
            <!-- values 1 se 10 ke bich or jo 2 se divide nhi hoti like 1,3,5,7,9-->
             <br>
            <input type="number" name="change" id="pennies" min="0" max="1" step="0.01" />
            <!-- isme numbering 0 se start hoti h or 1 pr end like 0, 0.1,0.2 -->
        </div>
        <div>
            <input type="datetime-local" name="datetime" id="datetime" />
        </div>
        <div>
            <input type="month" name="month" id="month" />
            <input type="time" name="time" id="time" />
            <input type="week" name="week" id="week" />
        </div>
        <div>
            <input type="color" name="color" id="color" />
            <textarea cols="30" rows="8"></textarea>
            <!-- textarea ki help se hm text ko limit de skte col or row ki help s -->
        </div>
        <div>
            <select name="fruits" id="fruit">
                <option value="Apple">Apple</option>
                <option value="Banana">Banana</option>
                <option value="Cherry">Cherry</option>
                <option value="Mango">Mango</option>
            </select>
        </div>
    </form>
</body>

</html>
